<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>米家全屋智能控制中心</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }
        .device-card {
            background: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(148, 163, 184, 0.1);
            transition: all 0.3s ease;
        }
        .device-card:hover {
            border-color: rgba(59, 130, 246, 0.5);
            transform: translateY(-2px);
        }
        .device-card.on {
            background: rgba(59, 130, 246, 0.15);
            border-color: rgba(59, 130, 246, 0.4);
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.2);
        }
        .device-icon {
            font-size: 2rem;
            transition: all 0.3s ease;
        }
        .device-card.on .device-icon {
            filter: drop-shadow(0 0 8px rgba(59, 130, 246, 0.8));
        }
        .toggle-switch {
            width: 48px;
            height: 26px;
            background: #475569;
            border-radius: 13px;
            position: relative;
            cursor: pointer;
            transition: background 0.3s;
            flex-shrink: 0;
        }
        .toggle-switch.on {
            background: #3b82f6;
        }
        .toggle-switch::after {
            content: '';
            position: absolute;
            width: 22px;
            height: 22px;
            background: white;
            border-radius: 50%;
            top: 2px;
            left: 2px;
            transition: transform 0.3s;
        }
        .toggle-switch.on::after {
            transform: translateX(22px);
        }
        .scene-card {
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.2), rgba(139, 92, 246, 0.2));
            border: 1px solid rgba(59, 130, 246, 0.3);
            cursor: pointer;
            transition: all 0.3s;
        }
        .scene-card:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 20px rgba(59, 130, 246, 0.3);
        }
        .scene-card:active {
            transform: scale(0.98);
        }
        .loading-spinner {
            border: 3px solid rgba(59, 130, 246, 0.2);
            border-top-color: #3b82f6;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .offline-badge {
            background: rgba(239, 68, 68, 0.2);
            color: #f87171;
        }
        .btn-primary {
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            transition: all 0.3s;
        }
        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4);
        }
        .login-card {
            background: rgba(30, 41, 59, 0.95);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(148, 163, 184, 0.1);
        }
    </style>
</head>
<body class="text-slate-100">
    <!-- 登录页 -->
    <div id="loginPage" class="min-h-screen flex items-center justify-center p-4 hidden">
        <div class="login-card rounded-2xl p-8 max-w-md w-full text-center">
            <div class="text-5xl mb-4">🏠</div>
            <h1 class="text-2xl font-bold mb-2">米家全屋智能控制中心</h1>
            <p class="text-slate-400 mb-8">统一管理你家所有的智能设备</p>

            <div id="loginBtnArea">
                <button onclick="startLogin()" class="btn-primary w-full py-3 rounded-xl font-medium text-white">
                    扫码登录米家账号
                </button>
                <p class="text-xs text-slate-500 mt-4">
                    登录凭证仅保存在本地，不会上传到任何第三方服务器
                </p>
            </div>

            <div id="loginWaiting" class="hidden">
                <div class="bg-slate-700/50 rounded-xl p-5 mb-6 text-left">
                    <p class="font-medium mb-3 flex items-center gap-2">
                        <span class="loading-spinner" style="width:20px;height:20px;border-width:2px;"></span>
                        等待扫码登录
                    </p>
                    <ol class="text-sm text-slate-300 space-y-2 list-decimal list-inside">
                        <li>查看运行 <code class="bg-slate-600 px-1.5 py-0.5 rounded text-xs">app.py</code> 的终端窗口</li>
                        <li>终端会显示二维码，用<strong>米家APP</strong>扫描</li>
                        <li>手机上确认授权登录</li>
                        <li>扫码成功后点击下方按钮</li>
                    </ol>
                </div>
                <button onclick="checkLoginResult()" class="btn-primary w-full py-3 rounded-xl font-medium text-white">
                    我已完成扫码
                </button>
            </div>
        </div>
    </div>

    <!-- 主界面 -->
    <div id="mainApp" class="hidden">
        <!-- 顶部导航 -->
        <header class="sticky top-0 z-40 bg-slate-900/80 backdrop-blur-lg border-b border-slate-700/50">
            <div class="max-w-7xl mx-auto px-4 py-4 flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <span class="text-2xl">🏠</span>
                    <h1 class="text-xl font-bold">全屋智能控制中心</h1>
                </div>
                <div class="flex items-center gap-3">
                    <span id="deviceCount" class="text-sm text-slate-400 hidden sm:block">加载中...</span>
                    <button onclick="refreshAll()" class="px-3 py-1.5 bg-slate-700 hover:bg-slate-600 rounded-lg text-sm transition flex items-center gap-1">
                        <span>🔄</span>
                        <span class="hidden sm:inline">刷新</span>
                    </button>
                    <button onclick="logout()" class="px-3 py-1.5 bg-red-500/20 hover:bg-red-500/30 text-red-400 rounded-lg text-sm transition">
                        退出
                    </button>
                </div>
            </div>
        </header>

        <main class="max-w-7xl mx-auto px-4 py-6">
            <!-- 快捷场景 -->
            <section class="mb-8">
                <h2 class="text-lg font-semibold mb-4 flex items-center gap-2">
                    <span>⚡</span> 快捷场景
                </h2>
                <div id="scenesGrid" class="flex gap-3 overflow-x-auto pb-2">
                    <div class="text-slate-500 text-sm py-4">加载中...</div>
                </div>
            </section>

            <!-- 房间设备 -->
            <section id="roomsContainer">
                <div class="text-center py-12 text-slate-500">
                    <div class="loading-spinner mx-auto mb-4"></div>
                    正在加载设备...
                </div>
            </section>
        </main>

        <!-- 底部状态栏 -->
        <footer class="fixed bottom-0 left-0 right-0 bg-slate-900/90 backdrop-blur border-t border-slate-700/50 py-2 px-4 text-center text-xs text-slate-500">
            <span id="lastUpdate">未刷新</span>
        </footer>
    </div>

    <script>
        // 设备图标映射
        const deviceIcons = {
            light: '💡',
            curtain: '🪟',
            ac: '❄️',
            sensor: '🌡️',
            plug: '🔌',
            switch: '🔘',
            fan: '🌀',
            humidifier: '💧',
            purifier: '🌬️',
            device: '📱'
        };

        // 初始化
        async function init() {
            const status = await checkLogin();
            if (status.logged) {
                showMainApp();
                loadAll();
            } else {
                showLoginPage();
            }
        }

        function showLoginPage() {
            document.getElementById('loginPage').classList.remove('hidden');
            document.getElementById('mainApp').classList.add('hidden');
        }

        function showMainApp() {
            document.getElementById('loginPage').classList.add('hidden');
            document.getElementById('mainApp').classList.remove('hidden');
        }

        // 检查登录状态
        async function checkLogin() {
            try {
                const res = await fetch('/api/login-status');
                return await res.json();
            } catch (e) {
                return { logged: false };
            }
        }

        // 开始登录
        async function startLogin() {
            document.getElementById('loginBtnArea').classList.add('hidden');
            document.getElementById('loginWaiting').classList.remove('hidden');

            // 触发后端生成二维码（会在终端显示）
            try {
                await fetch('/api/do-login', { method: 'POST' });
            } catch (e) {
                // 请求可能因为等待扫码而超时，这是正常的
            }
        }

        // 检查登录结果
        async function checkLoginResult() {
            const status = await checkLogin();
            if (status.logged) {
                showMainApp();
                loadAll();
            } else {
                alert('还未检测到登录，请确认米家APP已扫码并授权');
            }
        }

        // 退出登录
        async function logout() {
            if (!confirm('确定要退出登录吗？')) return;
            await fetch('/api/logout', { method: 'POST' });
            location.reload();
        }

        // 加载所有数据
        async function loadAll() {
            await Promise.all([
                loadScenes(),
                loadDevices()
            ]);
            updateLastUpdate();
        }

        function updateLastUpdate() {
            const now = new Date();
            document.getElementById('lastUpdate').textContent =
                `最后更新: ${now.toLocaleTimeString()}`;
        }

        // 加载场景
        async function loadScenes() {
            try {
                const res = await fetch('/api/scenes');
                const scenes = await res.json();
                const grid = document.getElementById('scenesGrid');

                if (!scenes || scenes.length === 0) {
                    grid.innerHTML = '<p class="text-slate-500 text-sm py-4">暂无场景，可在米家APP中添加</p>';
                    return;
                }

                grid.innerHTML = scenes.slice(0, 10).map(s => `
                    <div class="scene-card flex-shrink-0 px-5 py-4 rounded-xl min-w-[100px] text-center"
                         onclick="runScene('${s.scene_id || s.id}')">
                        <div class="text-2xl mb-1">🎬</div>
                        <div class="font-medium text-sm whitespace-nowrap">${s.name || '场景'}</div>
                    </div>
                `).join('');
            } catch (e) {
                document.getElementById('scenesGrid').innerHTML =
                    '<p class="text-slate-500 text-sm py-4">加载场景失败</p>';
            }
        }

        // 执行场景
        async function runScene(sceneId) {
            try {
                await fetch('/api/scene/run', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ scene_id: sceneId })
                });
                // 执行后刷新设备状态
                setTimeout(loadDevices, 1500);
            } catch (e) {
                alert('执行失败');
            }
        }

        // 加载设备
        async function loadDevices() {
            try {
                const res = await fetch('/api/devices');
                if (res.status === 401) {
                    showLoginPage();
                    return;
                }
                const homes = await res.json();
                const container = document.getElementById('roomsContainer');

                let totalDevices = 0;
                let onlineCount = 0;
                let html = '';

                for (const home of homes) {
                    for (const [roomName, devices] of Object.entries(home.rooms)) {
                        totalDevices += devices.length;
                        onlineCount += devices.filter(d => d.online).length;

                        html += `
                            <div class="mb-8">
                                <h2 class="text-lg font-semibold mb-4 flex items-center gap-2">
                                    <span>🚪</span> ${roomName}
                                    <span class="text-sm font-normal text-slate-400">(${devices.length}台)</span>
                                </h2>
                                <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
                                    ${devices.map(dev => renderDeviceCard(dev)).join('')}
                                </div>
                            </div>
                        `;
                    }
                }

                container.innerHTML = html || '<p class="text-slate-500 text-center py-12">暂无设备</p>';
                document.getElementById('deviceCount').textContent = `${onlineCount}/${totalDevices} 在线`;
                document.getElementById('deviceCount').classList.remove('hidden');
            } catch (e) {
                document.getElementById('roomsContainer').innerHTML =
                    '<p class="text-slate-500 text-center py-12">加载设备失败</p>';
            }
        }

        // 渲染设备卡片
        function renderDeviceCard(dev) {
            const icon = deviceIcons[dev.icon] || deviceIcons.device;
            const offlineClass = dev.online ? '' : 'opacity-50';

            return `
                <div class="device-card rounded-xl p-5 ${offlineClass}" id="dev-${dev.did}" data-did="${dev.did}">
                    <div class="flex items-start justify-between mb-3">
                        <div class="device-icon">${icon}</div>
                        ${!dev.online ? '<span class="offline-badge text-xs px-2 py-0.5 rounded-full">离线</span>' : ''}
                        <div class="toggle-switch" data-did="${dev.did}" onclick="toggleDevice('${dev.did}')"></div>
                    </div>
                    <div class="font-medium mb-1 truncate" title="${dev.name}">${dev.name}</div>
                    <div class="text-xs text-slate-400 mb-3 truncate">${dev.model || ''}</div>
                    <div class="device-status text-sm text-slate-300" id="status-${dev.did}">
                        ${dev.online ? '读取中...' : '离线'}
                    </div>
                </div>
            `;
        }

        // 切换设备开关
        async function toggleDevice(did) {
            const card = document.getElementById(`dev-${did}`);
            const toggle = card.querySelector('.toggle-switch');
            const isOn = toggle.classList.contains('on');
            const newValue = !isOn;

            // 立即更新UI（乐观更新）
            toggle.classList.toggle('on', newValue);
            card.classList.toggle('on', newValue);
            document.getElementById(`status-${did}`).textContent = newValue ? '已开启' : '已关闭';

            try {
                const res = await fetch('/api/device/control', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        did: did,
                        siid: 2,
                        piid: 1,
                        value: newValue
                    })
                });
                const result = await res.json();
                if (result.status !== 'success') {
                    throw new Error(result.message);
                }
            } catch (e) {
                // 失败回滚
                toggle.classList.toggle('on', isOn);
                card.classList.toggle('on', isOn);
                document.getElementById(`status-${did}`).textContent = isOn ? '已开启' : '已关闭';
                console.error('控制失败', e);
            }
        }

        // 手动刷新
        function refreshAll() {
            loadAll();
        }

        // 启动
        init();
    </script>
</body>
</html>
